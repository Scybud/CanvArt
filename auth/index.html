<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth | LogHue</title>

    <!--CSS LINKS-->

        <!--SCYBUD UI-->
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css">
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css">
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    
    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components/forms.css">
<link rel="stylesheet" href="../css/components/buttons.css">

    <!--FAVICONS-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/icons/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicons/favicon-16x16.png"
    />

    <style>
      main {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .authGateway {
        max-width: 460px;
        width: 100%;
        margin: 0 auto;
        padding: var(--space-md);
        text-align: center;
      }

      .authGateway .logo {
        width: 80px;
        border-radius: var(--radius-md);
        corner-shape: squircle;
        margin-bottom: 1rem;
      }

      .authGateway h1 {
        font-size: 1.6rem;
      }
      p {
        margin-bottom: 2rem;
      }
.oauthContainer {
  display: flex;
  gap: var(--space-md);
}
      .oauthBtn {
        color: var(--text-primary);
        width: 100%;
        padding: 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface-primary);
        margin-bottom: 0.75rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .oauthBtn:hover {
        background: var(--surface-secondary);
        border-color: var(--border-light);
      }

      .oauthBtn .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .oauthBtn svg {
        width: 18px;
        height: 18px;
      }

      .primaryBtn {
        background: var(--active);
        margin-bottom: 0.75rem;
      }
      .secondaryBtn {
        background: var(--surface-secondary);
      }
      .primaryBtn,
      .secondaryBtn {
        width: 100%;
        display: block;
        padding: 0.75rem;
        color: var(--color-primary);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.5 ease;
      }
      .primaryBtn:hover,
      .secondaryBtn:hover {
        text-decoration: none;
      }
      
      button{
           width: 100%;
        display: block;
        margin-top: 12px;
      }
      .divider {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 1.5rem 0;
      }

      .divider span {
        padding: 0 0.5rem;
        color: var(--text-secondary);
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }
.emailLogin:hover {
  background: var(--surface-secondary);
  border-color: var(--primary);
  color: var(--text-primary);
}
      .form {
        margin-top: 50px;
        display: none;
      }
       .display {
        gap: 10px;
        display: flex;
      }
      .backBtn.show {
        display: block;
      }
      .backBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: sticky;
        top: 30px;
        left: 20px;
        padding: 0 auto;
        width: fit-content;
        background: none;
        color: var(--link);
      }
      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
         <div id="modalContainer"></div>
        <!--ACTION MESSAGES-->
        <div id="actionsMessage"></div>
        <!--INFO DISPLAY-->
        <div id="infoDisplay"></div>

    <button type="button" class="btn backBtn btn-sm"> <!-- Back Icon -->
        <svg
  width="20"
  height="20"
  viewBox="0 0 20 20"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <path
    d="M11.75 4.25L6 10L11.75 15.75"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
 <span>Back</span>
</button>

    <main class="main">
      <!-- AUTH GATEWAY -->
      <div class="authGateway">
        <img
        src="../assets/images/canvart-logo.png"
        class="logo"
        alt="LogHue Logo"
        />
        
        <h1>Welcome to <span class="logo">Canv<span>Art</span></span></h1>
        <p class="text-muted">Log in to manage your tasks, notes, and decisions</p>

        <a href="login.html" class="primaryBtn emailLogin" id="emailLogin"
          >Log in with Email</a
        >
        <a
          href="register.html"
          class="secondaryBtn oauthBtn emailSignup"
          id="emailSignup"
          >Create an Account</a
          >
          <div class="divider"><span>or</span></div>
        <div class="oauthContainer">

          <!-- GOOGLE -->
          <button class="oauthBtn google" id="googleAuth">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 48 48">
                <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.23 9.21 3.64l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.02 17.74 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.5 24.5c0-1.57-.14-3.08-.41-4.5H24v9h12.85c-.56 2.85-2.2 5.26-4.7 6.88l7.27 5.64C43.79 37.52 46.5 31.47 46.5 24.5z"
              />
              <path
                fill="#FBBC05"
                d="M10.54 28.41c-.48-1.43-.75-2.95-.75-4.5s.27-3.07.75-4.5l-7.98-6.19C.92 16.07 0 19.94 0 24c0 4.06.92 7.93 2.56 11.28l7.98-6.19z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.47 0 11.9-2.38 15.92-6.5l-7.27-5.64c-2.01 1.35-4.58 2.14-8.65 2.14-6.26 0-11.57-3.52-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              />
            </svg>
          </span>
        </button>

        <!-- MICROSOFT -->
        <button class="oauthBtn microsoft" id="microsoftAuth">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 23 23">
              <rect width="10" height="10" fill="#F35325" />
              <rect x="12" width="10" height="10" fill="#81BC06" />
              <rect y="12" width="10" height="10" fill="#05A6F0" />
              <rect x="12" y="12" width="10" height="10" fill="#FFBA08" />
            </svg>
          </span>
        </button>

<!-- FACEBOOK -->
<button class="oauthBtn facebook" id="facebookAuth">
  <span class="icon">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="12" fill="#1877F2"></circle>
      <path 
        d="M15.1 12.8l.4-2.6h-2.5V8.7c0-.7.3-1.3 1.3-1.3h1.3V5.1c-.6-.1-1.4-.2-2.3-.2-2.3 0-3.8 1.4-3.8 3.9v2.3H7.2v2.6h2.3v6.6h2.9v-6.6h2.7z"
        fill="#fff">
      </path>
    </svg>
  </span>
</button>


      </div>
        
        
      </div>

    </main>

    <script type="module" src="../js/auth/auth.js"></script>
  </body>
</html>
