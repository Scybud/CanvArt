<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork | CanvArt</title>

    <!--CSS LINKS-->

    <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />

    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/main.css" />
        <link rel="stylesheet" href="../css/components/cards/artworkCard.css">
    <link rel="stylesheet" href="../css/components/forms.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/toast.css" />
    <link rel="stylesheet" href="../css/artwork.css" />

    <!--FAVICONS-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/icons/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicons/favicon-16x16.png"
    />
  </head>
  <body>
    <!--TOAST MESSAGES-->
    <div id="toast"></div>
    <!--MODAL CONTAINER-->
    <div id="modalContainer"></div>

    <!--SIDEBAR TOGGLE BUTTON-->
    <button class="toggle-sidebar" id="toggleSidebar">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>

    <main class="main">
      <!--SIDEBAR-->
      <aside class="sidebar" id="artworkSidebar"></aside>

      <!--MAIN CONTENT-->
      <article id="mainContent" class="main-content">
        <!--HERO-->
        <section class="hero">
          <!--HERO BANNER-->
          <div class="hero-banner">
            <!--HERO BANNER LEFT-->
            <div class="hero-banner-left">
              <img
                src="../assets/images/canvart-logo.png"
                alt="CanvArt Logo"
                class="logo-img"
              />
              <div class="flex-column">
                <span class="banner-header">Feel The Art</span>
                <p class="banner-text">
                  Discover casual art from creators around the world.
                </p>
                <p class="banner-text">
                  Share your art. No pressure. Just create.
                </p>
              </div>
            </div>

            <!--HERO BANNER RIGHT-->
            <div class="hero-banner-right">
              <a href="../auth/login" class="btn-pill btn btn-no-bg">Login</a>
              <a href="../auth/register" class="btn-pill btn">Register</a>
            </div>
          </div>
        </section>

        <section class="artwork-container">
            <div class="artworkControls">
  <button id="backBtn" class="icon-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <button id="menuToggle" class="icon-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="5" r="1.8" fill="currentColor" />
      <circle cx="12" cy="12" r="1.8" fill="currentColor" />
      <circle cx="12" cy="19" r="1.8" fill="currentColor" />
    </svg>
  </button>
</div>

<div id="artworkMenu" class="artworkMenu" hidden>
  <nav class="artwork-menu-btns">
    <button class="btn shareArtworkBtn">Share</button>
    <a class="btn" id="artistBtn">Artist</a>
    <button class="btn danger" id="reportOrDeleteBtn"></button>
  </nav>
</div>

          <div class="artworkContainer">
            <img
              src="../assets/images/canvart-logo.png"
              alt="Artwork Image"
              id="artworkImg"
              class="artwork-img"
            />
          </div>

          <div class="artwork-data">

            <h2 class="artwork-title" id="artworkTitle">Fan ART</h2>

              <p id="artworkDescription" class="artwork-description">Art by me is a very good fit for the desaput of a jub manetupaku latef as ipatr Uakscs km sdm sj kmk ski km ks kjsdkmd sjjns sn d sksdkk kdm skd ds</p>
          </div>
        </section>

    </main>

    <!--JS-->
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/artwork.js"></script>
  </body>
</html>
