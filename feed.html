<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Feed | CanvArt</title>

    <!--CSS LINKS-->

    <!--SCYBUD UI-->
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css" />

    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components/forms.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/toast.css" />
    <link rel="stylesheet" href="css/feed.css" />

    <!--FAVICONS-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicons/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!--TOAST MESSAGES-->
    <div id="toast"></div>

    <!--SIDEBAR TOGGLE BUTTON-->
    <button class="toggle-sidebar" id="toggleSidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>

    <div id="modalContainer"></div>

    <main class="main">
      <!--SIDEBAR-->
      <aside class="sidebar" id="sidebar"></aside>

      <!--MAIN CONTENT-->
      <article id="mainContent" class="main-content feedPage">
        <section class="feed" id="feed" aria-label="Artwork feed"></section>

        <!--DESKTOP UP AND DOWN BUTTONS-->
        <div class="feedNav">
          <button type="button" id="feedUp" aria-label="Previous artwork">
            <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg>
          </button>
          <button type="button" id="feedDown" aria-label="Next artwork">
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
          </button>
        </div>
      </article>
    </main>

    <!--ADD TO COLLECTION SHEET-->
    <div class="feedSheet" id="collectSheet" hidden>
      <div class="feedSheetPanel">
        <h3>Add to collection</h3>
        <div id="collectRows"></div>
      </div>
    </div>

    <!--JS-->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/feed.js"></script>
  </body>
</html>
