<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | CanvArt</title>

    <!--CSS LINKS-->

    <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />
<link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/animations.css"
    />
    
    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/components/cards/artworkCard.css">
        <link rel="stylesheet" href="../css/components/cards/collectionCard.css">
    <link rel="stylesheet" href="../css/components/forms.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/toast.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/components/emptyState.css" />

    <!--FAVICONS-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/icons/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/icons/favicons/favicon-16x16.png"
    />
  </head>
  <body>
    <!--TOAST MESSAGES-->
    <div id="toast"></div>
    <!--MODAL CONTAINER-->
    <div id="modalContainer"></div>

    <!--SIDEBAR TOGGLE BUTTON-->
    <button class="toggle-sidebar" id="toggleSidebar">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>

    <main class="main">
      <!--SIDEBAR-->
      <aside class="sidebar" id="profileSidebar"></aside>

      <!--MAIN CONTENT-->
      <article id="mainContent" class="main-content">
        <!--HERO-->
        <section class="hero">
          <!--HERO BANNER-->
          <div class="hero-banner">
            <!--HERO BANNER LEFT-->
            <div class="hero-banner-left">
              <img
                src="../assets/images/canvart-logo.png"
                alt="CanvArt Logo"
                class="logo-img"
              />
              <div class="flex-column">
                <span class="banner-header">Feel The Art</span>
                <p class="banner-text">
                  Discover casual art from creators around the world.
                </p>
                <p class="banner-text">
                  Share your art. No pressure. Just create.
                </p>
              </div>
            </div>

            <!--HERO BANNER RIGHT-->
            <div class="hero-banner-right">
              <a href="../auth/login" class="btn-pill btn btn-no-bg">Login</a>
              <a href="../auth/register" class="btn-pill btn">Register</a>
            </div>
          </div>
        </section>

        <!--PROFLE HEADER-->
        <section class="profile-header">
          <div class="profile-cover">
            <button
              type="button"
              class="profile-edit editBtn icon-btn"
              id="profileEdit"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5l4 4L8 20l-4 1 1-4L16.5 3.5z" />
              </svg>
            </button>
          </div>

          <div class="user-profile-data">
            <img
              src="https://joincanvart.vercel.app/assets/images/canvart-logo.png"
              alt="Profile image"
              id="profileAvatar"
              class="profile-avatar"
            />
            <h2 class="profile-name" id="profileName">Name Loading...</h2>
            <span class="profile-username" id="profileUsername"
              >@Username Loading...</span
            >

            <div class="profile-bio-container">
              <p id="profileBio" class="profile-bio">
               Bio Loading...
              </p>
            </div>
          </div>
        </section>

        <!--PROFLE BODY-->
        <section class="profile-body">
          <div class="view-switcher">
            <button class="view-btn active" id="viewArtworksBtn">
              Artworks
            </button>
            <button type="button" class="view-btn" id="viewCollectionsBtn">
              Collections
            </button>
          </div>

          <div id="profileContent"></div>
        </section>
      </article>
    </main>

    <!--JS-->
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/profile.js"></script>
  </body>
</html>
