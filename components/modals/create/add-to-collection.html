<section class="modal-container">
  <div class="card form add-to-collection-modal">

    <div class="section-header">
      <h2 class="section-title">Add Artwork to Collection</h2>

      <button type="button" class="closeModalBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="17" height="17" rx="6" ry="6" fill="currentColor" opacity="0.06" />
          <path d="M9 9l6 6M15 9l-6 6" />
        </svg>
      </button>
    </div>

    <p class="modal-subtitle">Choose one of your artworks</p>

    <!-- CAROUSEL -->
    <div class="artwork-carousel" id="artworkCarousel">
      <!-- JS will inject artwork items here -->
    </div>

    <button class="btn" id="confirmAddToCollectionBtn" disabled>
      Add to Collection
    </button>

  </div>
</section>
