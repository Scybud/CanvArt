<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artists | Feel the Art</title>

    <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />

    <!--APP CSS-->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/artists.css" />

        <!--FAVICONS-->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicons/favicon-16x16.png">
  </head>

  <body>
    <!--SIDEBAR TOGGLE BUTTON-->
    <button class="toggle-sidebar" id="toggleSidebar">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>

    <main class="main">
      <!--SIDEBAR-->
      <aside class="sidebar" id="sidebar"></aside>

      <!--MAIN CONTENT-->
      <article class="main-content">

           <!--HERO-->
        <section class="hero">
          <!--HERO BANNER-->
          <div class="hero-banner">
            <!--HERO BANNER LEFT-->
            <div class="hero-banner-left">
              <img src="assets/images/canvart-logo.png" alt="CanvArt Logo" class="logo-img" />
              <div class="flex-column">
                <span class="banner-header">Feel The Art</span>
                <p class="banner-text">Discover casual art from creators around the world.</p>
                <p class="banner-text">Share your art. No pressure. Just create.</p>
              </div>
            </div>

            <!--HERO BANNER RIGHT-->
            <div class="hero-banner-right">
              <a href="auth/login" class="btn-pill btn btn-no-bg">Login</a>
                            <a href="auth/register" class="btn-pill btn">Register</a>
            </div>
          </div>
        </section>

        <section class="artists-page">
          <!--TOP SECTION-->
          <section class="artists-top">
            <div>
              <h1 class="artists-page-title">Artists</h1>

              <p class="artists-page-text">
                Discover creators, explore unique art styles, and find new
                inspiration from casual artists around the world.
              </p>
            </div>

            <!--SEARCH-->
            <div class="artists-search">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>

              <input
                type="search"
                placeholder="Search artists..."
                id="artistSearchInput"
              />
            </div>
          </section>

          <!--FEATURED ARTISTS-->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Featured Artists</h2>
            </div>

            <div id="featuredArtists" class="featured-artists-row">
              <!--FEATURED CARD-->
             
            </div>
          </section>

          <!--EXPLORE ARTISTS-->
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Discover Artists</h2>
            </div>

            <!--GRID-->
            <div class="artists-grid" id="artistsGrid">
              
            </div>
          </section>
        </section>
      </article>
    </main>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/artists.js"></script>
  </body>
</html>
